services:
  caddy:
    image: caddy:latest
    container_name: social_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app_network

  backend:
    build: ./backend
    container_name: social_backend
    restart: unless-stopped
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - ./backend/src:/var/www/html
    networks:
      - app_network
    environment:
      - DOMAIN=${DOMAIN:-localhost}

  reverb:
    build: ./backend
    container_name: social_reverb
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./backend/src:/var/www/html
    networks:
      - app_network
    command: php artisan reverb:start --host="0.0.0.0" --port="8080"

  frontend:
    build: ./frontend
    container_name: social_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app
      - /app/node_modules
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config: