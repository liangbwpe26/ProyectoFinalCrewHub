services:
  backend:
    build: ./backend
    container_name: social_backend
    restart: always
    ports:
      - "80:80"    # <--- MAGIA: Caddy ahora escucha en el puerto web universal
      - "443:443"
    volumes:
      - ./backend/src:/var/www/html
      - ./backend/Caddyfile:/etc/caddy/Caddyfile
    networks:
      - app_network
    environment:
      - DOMAIN=${DOMAIN:-localhost}

  reverb:
    build: ./backend
    container_name: social_reverb
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./backend/src:/var/www/html
    networks:
      - app_network
    command: php artisan reverb:start --host="0.0.0.0" --port="8080"

  frontend:
    build: ./frontend
    container_name: social_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app
      - /app/node_modules
    networks:
      - app_network

  mongodb:
    image: mongo:latest
    container_name: social_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network
    profiles:
      - local

networks:
  app_network:
    driver: bridge

volumes:
  mongo_data: